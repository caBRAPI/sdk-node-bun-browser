name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

concurrency:
  group: ci-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    container:
      image: node:26-alpine

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: /root/.npm
          key: node-${{ hashFiles('package.json') }}
          restore-keys: node-

      - name: Install dependencies
        run: npm install

      - name: Biome check
        run: npx @biomejs/biome check
